[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionhead"
version = "0.1.0"
description = "Self-hosted typed-question decision service (Jev-shaped API) over any local model that exposes logprobs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Dinand Tinholt" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
]
# Purely a training-time speed optimization for decisionhead.model's
# gradient descent (decisionhead.train). Never required: the pure-Python
# fallback implements the identical algorithm, and nothing on the
# serving path (decisionhead.learned/decisionhead.server) imports numpy
# at all, so a serving-only install stays zero-dependency.
train = [
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/dtinholt/decision-head"
Issues = "https://github.com/dtinholt/decision-head/issues"

[project.scripts]
decisionhead = "decisionhead.__main__:main"

[tool.setuptools]
packages = ["decisionhead"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S101: assert is used deliberately, in tests and in a couple of
#   "this cannot happen" internal invariants.
# S104: binding to a non-loopback interface is an explicit, tested,
#   opt-in feature (--allow-non-local-bind), not an accident.
# S310: every urlopen()/Request() call in this codebase targets a base
#   URL the operator configured (their own ollama/vLLM host, or a server
#   this same package started) -- never a URL derived from request input.
# S311: random.Random is used only for synthetic test fixtures and the
#   FakeBackend's deterministic-but-varied stand-in distributions, never
#   for anything security-sensitive.
ignore = ["S101", "S104", "S310", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603", "S607"]
"dh_*.py" = ["F401", "F403"]
"examples/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = ["decisionhead"]

[[tool.mypy.overrides]]
module = "decisionhead.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# numpy is an optional, training-only speed extra (decisionhead[train]);
# this keeps decisionhead._numpy_opt type-checkable whether or not it is
# installed in the environment running mypy, without an inline "type:
# ignore" comment that would itself become an error (warn_unused_ignores
# above) whenever numpy DOES happen to be present.
module = "numpy"
ignore_missing_imports = true
